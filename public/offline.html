<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Spinsight</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f3ebdd; --fg: #2a1e16; --muted: #7a6654; --accent: #b5462a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17110d; --fg: #f1e6d4; --muted: #a8927b; --accent: #e0773f; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 16px; }
      img { width: 96px; height: 96px; animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { img { animation: none; } }
      h1 { font-family: Georgia, serif; font-size: 2rem; margin: 24px 0 8px; }
      p { color: var(--muted); max-width: 22rem; margin: 0 auto 24px; }
      button { background: var(--accent); color: var(--bg); border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" />
      <h1>Between tracks</h1>
      <p>You're offline. Your records are still on the shelf. Spinsight will be back when the connection is.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
